name: Deploy

on:
  push:
    branches: [main]
  # Actions タブからの手動実行も許可する
  workflow_dispatch:

# デプロイの同時実行を防ぐ。実行中の run があれば完了を待つ(キャンセルしない)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # wrangler deploy が build.command(make build)で Go → wasm ビルドするため必要
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # スキーマ更新 → コードデプロイの順。migrations apply は適用済み分をスキップする(冪等)
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ローカルの wrangler と同じバージョンに固定(挙動差を防ぐ)。ローカルを上げたらここも上げる
          wranglerVersion: "4.115.0"
          command: |
            d1 migrations apply jobwatch --remote
            deploy
